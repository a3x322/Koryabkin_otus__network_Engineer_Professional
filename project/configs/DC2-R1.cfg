!
hostname DC2-R1
!
vrf definition CORP-MPLS
 rd 65002:1
 address-family ipv4
 exit-address-family
!
vrf definition MGMT
 rd 65002:99
 address-family ipv4
 exit-address-family
!
interface Loopback0
 ip address 10.255.2.1 255.255.255.255
!
interface TenGigabitEthernet1/0/1
 description DC2-R1_to_DC2-R2
 no switchport
 ip address 10.254.2.0 255.255.255.254
 bfd interval 50 min_rx 50 multiplier 3
 no shutdown
!
interface TenGigabitEthernet1/0/2
 description DC2-R1_to_DC1-R1_DARK_FIBER
 no switchport
 ip address 10.254.100.1 255.255.255.254
 bfd interval 50 min_rx 50 multiplier 3
 no shutdown
!
interface Port-channel10
 description DC2_CORE_MLAG
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,50,60,999
 no shutdown
!
interface TenGigabitEthernet1/0/47
 channel-group 10 mode active
 no shutdown
!
interface TenGigabitEthernet1/0/48
 channel-group 10 mode active
 no shutdown
!
interface Vlan10
 description MANAGEMENT
 vrf forwarding MGMT
 ip address 10.2.10.2 255.255.255.0
 standby version 2
 standby 10 ip 10.2.10.1
 standby 10 priority 115
 standby 10 preempt delay minimum 60
!
interface Vlan20
 description USERS
 vrf forwarding CORP-MPLS
 ip address 10.2.20.2 255.255.254.0
 standby version 2
 standby 20 ip 10.2.20.1
 standby 20 priority 115
 standby 20 preempt delay minimum 60
!
interface Vlan30
 description VOICE
 vrf forwarding CORP-MPLS
 ip address 10.2.30.2 255.255.255.0
 standby version 2
 standby 30 ip 10.2.30.1
 standby 30 priority 115
 standby 30 preempt delay minimum 60
!
interface Vlan40
 description CCTV
 vrf forwarding CORP-MPLS
 ip address 10.2.40.2 255.255.255.0
 standby version 2
 standby 40 ip 10.2.40.1
 standby 40 priority 115
 standby 40 preempt delay minimum 60
!
interface Vlan50
 description SERVERS
 vrf forwarding CORP-MPLS
 ip address 10.2.50.2 255.255.255.0
 standby version 2
 standby 50 ip 10.2.50.1
 standby 50 priority 115
 standby 50 preempt delay minimum 60
!
interface Vlan60
 description BACKUP
 vrf forwarding CORP-MPLS
 ip address 10.2.60.2 255.255.255.0
 standby version 2
 standby 60 ip 10.2.60.1
 standby 60 priority 115
 standby 60 preempt delay minimum 60
!
router eigrp EIGRP-CORE
 address-family ipv4 autonomous-system 100
  network 10.254.0.0 0.0.255.255
  network 10.255.2.1 0.0.0.0
  passive-interface default
  no passive-interface TenGigabitEthernet1/0/1
  no passive-interface TenGigabitEthernet1/0/2
  bfd all-interfaces
 exit-address-family
!
ip route vrf CORP-MPLS 10.2.0.0 255.255.0.0 Null0 250
!
router bgp 65002
 bgp log-neighbor-changes
 address-family ipv4 vrf CORP-MPLS
  network 10.2.0.0 mask 255.255.0.0
  neighbor 172.31.2.0 remote-as 64500
  neighbor 172.31.2.0 activate
  neighbor 172.31.2.0 fall-over bfd
 exit-address-family
!
end
!
