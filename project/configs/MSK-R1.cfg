!
hostname MSK-R1
!
vrf definition CORP-MPLS
 rd 65100:1
 address-family ipv4
 exit-address-family
!
vrf definition MGMT
 rd 65100:99
 address-family ipv4
 exit-address-family
!
interface Loopback0
 ip address 10.255.10.1 255.255.255.255
!
interface GigabitEthernet0/0/0
 description MSK-R1_to_MPLS-PE1
 vrf forwarding CORP-MPLS
 ip address 172.31.10.0 255.255.255.254
 bfd interval 50 min_rx 50 multiplier 3
 no shutdown
!
interface GigabitEthernet0/0/1
 description MSK-R1_to_MPLS-PE2
 vrf forwarding CORP-MPLS
 ip address 172.31.10.2 255.255.255.254
 bfd interval 50 min_rx 50 multiplier 3
 no shutdown
!
interface Port-channel10
 description MSK-R1_R2_LACP
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,50,60,999
 no shutdown
!
interface Vlan10
 description MANAGEMENT
 vrf forwarding MGMT
 ip address 10.10.10.2 255.255.255.0
 standby version 2
 standby 10 ip 10.10.10.1
 standby 10 priority 115
 standby 10 preempt
!
interface Vlan20
 description USERS
 vrf forwarding CORP-MPLS
 ip address 10.10.20.2 255.255.254.0
 standby version 2
 standby 20 ip 10.10.20.1
 standby 20 priority 115
 standby 20 preempt
!
interface Vlan30
 description VOICE
 vrf forwarding CORP-MPLS
 ip address 10.10.30.2 255.255.255.0
 standby version 2
 standby 30 ip 10.10.30.1
 standby 30 priority 115
 standby 30 preempt
!
interface Vlan40
 description CCTV
 vrf forwarding CORP-MPLS
 ip address 10.10.40.2 255.255.255.0
 standby version 2
 standby 40 ip 10.10.40.1
 standby 40 priority 115
 standby 40 preempt
!
interface Vlan50
 description SERVERS
 vrf forwarding CORP-MPLS
 ip address 10.10.50.2 255.255.255.0
 standby version 2
 standby 50 ip 10.10.50.1
 standby 50 priority 115
 standby 50 preempt
!
interface Vlan60
 description BACKUP
 vrf forwarding CORP-MPLS
 ip address 10.10.60.2 255.255.255.0
 standby version 2
 standby 60 ip 10.10.60.1
 standby 60 priority 115
 standby 60 preempt
!
ip route vrf CORP-MPLS 10.10.0.0 255.255.0.0 Null0 250
!
router bgp 65100
 bgp log-neighbor-changes
 address-family ipv4 vrf CORP-MPLS
  network 10.10.0.0 mask 255.255.0.0
  neighbor 172.31.10.1 remote-as 64500
  neighbor 172.31.10.1 activate
  neighbor 172.31.10.1 fall-over bfd
  neighbor 172.31.10.3 remote-as 64500
  neighbor 172.31.10.3 activate
  neighbor 172.31.10.3 fall-over bfd
 exit-address-family
!
end
!
