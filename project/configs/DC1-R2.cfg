!
hostname DC1-R2
!
vrf definition CORP-MPLS
 rd 65001:1
 address-family ipv4
 exit-address-family
!
vrf definition MGMT
 rd 65001:99
 address-family ipv4
 exit-address-family
!
interface Loopback0
 ip address 10.255.1.2 255.255.255.255
!
interface TenGigabitEthernet1/0/1
 description DC1-R2_to_DC1-R1
 no switchport
 ip address 10.254.1.1 255.255.255.254
 bfd interval 50 min_rx 50 multiplier 3
 no shutdown
!
interface TenGigabitEthernet1/0/2
 description DC1-R2_to_DC2-R2_DARK_FIBER
 no switchport
 ip address 10.254.100.2 255.255.255.254
 bfd interval 50 min_rx 50 multiplier 3
 no shutdown
!
interface Port-channel10
 description DC1_CORE_MLAG
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,50,60,999
 no shutdown
!
interface TenGigabitEthernet1/0/47
 channel-group 10 mode active
 no shutdown
!
interface TenGigabitEthernet1/0/48
 channel-group 10 mode active
 no shutdown
!
interface Vlan10
 description MANAGEMENT
 vrf forwarding MGMT
 ip address 10.1.10.3 255.255.255.0
 standby version 2
 standby 10 ip 10.1.10.1
 standby 10 priority 100
 standby 10 preempt delay minimum 60
!
interface Vlan20
 description USERS
 vrf forwarding CORP-MPLS
 ip address 10.1.20.3 255.255.254.0
 standby version 2
 standby 20 ip 10.1.20.1
 standby 20 priority 100
 standby 20 preempt delay minimum 60
!
interface Vlan30
 description VOICE
 vrf forwarding CORP-MPLS
 ip address 10.1.30.3 255.255.255.0
 standby version 2
 standby 30 ip 10.1.30.1
 standby 30 priority 100
 standby 30 preempt delay minimum 60
!
interface Vlan40
 description CCTV
 vrf forwarding CORP-MPLS
 ip address 10.1.40.3 255.255.255.0
 standby version 2
 standby 40 ip 10.1.40.1
 standby 40 priority 100
 standby 40 preempt delay minimum 60
!
interface Vlan50
 description SERVERS
 vrf forwarding CORP-MPLS
 ip address 10.1.50.3 255.255.255.0
 standby version 2
 standby 50 ip 10.1.50.1
 standby 50 priority 100
 standby 50 preempt delay minimum 60
!
interface Vlan60
 description BACKUP
 vrf forwarding CORP-MPLS
 ip address 10.1.60.3 255.255.255.0
 standby version 2
 standby 60 ip 10.1.60.1
 standby 60 priority 100
 standby 60 preempt delay minimum 60
!
router eigrp EIGRP-CORE
 address-family ipv4 autonomous-system 100
  network 10.254.0.0 0.0.255.255
  network 10.255.1.2 0.0.0.0
  passive-interface default
  no passive-interface TenGigabitEthernet1/0/1
  no passive-interface TenGigabitEthernet1/0/2
  bfd all-interfaces
 exit-address-family
!
ip route vrf CORP-MPLS 10.1.0.0 255.255.0.0 Null0 250
!
router bgp 65001
 bgp log-neighbor-changes
 address-family ipv4 vrf CORP-MPLS
  network 10.1.0.0 mask 255.255.0.0
  neighbor 172.31.1.4 remote-as 64500
  neighbor 172.31.1.4 activate
  neighbor 172.31.1.4 fall-over bfd
  neighbor 172.31.1.6 remote-as 64500
  neighbor 172.31.1.6 activate
  neighbor 172.31.1.6 fall-over bfd
 exit-address-family
!
end
!
