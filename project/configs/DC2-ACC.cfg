!
hostname DC2-ACC
!
vtp mode transparent
spanning-tree mode rapid-pvst
!
vlan 10
 name MANAGEMENT
!
vlan 20
 name USERS
!
vlan 30
 name VOICE
!
vlan 40
 name CCTV
!
vlan 50
 name SERVERS
!
vlan 60
 name BACKUP
!
vlan 999
 name NATIVE-BLACKHOLE
!
interface Port-channel1
 description UPLINK_TO_DC2_CORE
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,50,60,999
 switchport trunk native vlan 999
 spanning-tree guard root
!
interface range GigabitEthernet1/0/47-48
 description LACP_UPLINK
 channel-group 1 mode active
 no shutdown
!
interface Vlan10
 ip address 10.2.10.11 255.255.255.0
 no shutdown
!
ip default-gateway 10.2.10.1
!
ip dhcp snooping
ip dhcp snooping vlan 20,30,40,50,60
!
interface Port-channel1
 ip dhcp snooping trust
!
spanning-tree portfast bpduguard default
!
end
!
